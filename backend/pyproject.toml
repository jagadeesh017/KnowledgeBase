[project]
name = "knowledge-platform"
version = "0.1.0"
description = "Multi-user agentic knowledge platform"
authors = [
    { email = "jagadeeshuttaravill117@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ollama>=0.6.3",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "knowledge_platform"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
